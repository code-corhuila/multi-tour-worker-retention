# The worker has no database and no volume, and publishes no port: it reaches commercial-reservation by its name on the platform
# network, and the root composition (multi-tour-infra-postgres) includes this file.
services:
  worker-retention:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Issued by multi-tour-security for this worker; never versioned. Its own name, because the root composition
      # reads one variables file for every service and SERVICE_TOKEN there is the token of the event relay.
      SERVICE_TOKEN: ${WORKER_RETENTION_SERVICE_TOKEN:?WORKER_RETENTION_SERVICE_TOKEN is required, set it in env/<environment>.env}
      # No default: a wrong guess of a service name or port must fail visibly.
      COMMERCIAL_RESERVATION_BASE_URL: ${COMMERCIAL_RESERVATION_BASE_URL:?COMMERCIAL_RESERVATION_BASE_URL is required, e.g. http://commercial-reservation-api:8083}
      # The tenants to sweep: no service route lists them yet (see README).
      TENANT_IDS: ${TENANT_IDS:-}
      RETENTION_INTERVAL: ${RETENTION_INTERVAL:-24h}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      RUN_TIMEOUT: ${RUN_TIMEOUT:-30s}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-5s}
      HTTP_ATTEMPTS: ${HTTP_ATTEMPTS:-3}
      HEALTH_ADDR: ${HEALTH_ADDR:-:8080}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    external: true
